name: Build Windows

on:
  push:
    paths:
      - 'desktop_src/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_src/requirements-win.txt

      - name: Build with PyInstaller
        run: |
          cd desktop_src
          python -m PyInstaller --onedir --windowed --name "SayAI" `
            --add-data "license.py;." `
            --add-data "reporter.py;." `
            --collect-all webview `
            --exclude-module pytest `
            --exclude-module _pytest `
            PromptBridge.py
        shell: pwsh

      - name: Package as zip
        run: |
          Compress-Archive -Path desktop_src/dist/SayAI/* -DestinationPath sayai-win.zip
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: sayai-win.zip
          tag_name: v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
